<path d="M440 340h48" stroke="#dce9e5" stroke-width="10"/>
<path d="M440 340v-48 M440 340a48 48 0 0 0 48 -48" class="door"/>
<!-- doors / openings -->
<path d="M400 375h24 M400 375a24 24 0 0 1 24 24" class="door"/>
<path d="M520 375h-24 M520 375a24 24 0 0 0 -24 24" class="door"/>
<path d="M400 550h24 M400 550a24 24 0 0 1 24 24" class="door"/>
<path d="M460 550h-24 M460 550a24 24 0 0 0 -24 24" class="door"/>
<path d="M620 490h-24 M620 490a24 24 0 0 1 -24 24" class="door"/>
<path d="M620 630h-24 M620 630a24 24 0 0 0 -24 24" class="door"/>
<path d="M430 980v-32 M430 980a32 32 0 0 0 32 -32" class="door"/>
<!-- open living/dining connection -->
<path d="M500 700v70 M500 900v80" stroke="#26384b" stroke-width="7"/>
<text x="500" y="680" text-anchor="middle" class="s">wide opening</text>
<!-- porch dimension -->
<text x="460" y="1168" text-anchor="middle" class="dim">Front / South</text>
<text x="500" y="1210" text-anchor="middle" class="s">Room labels are approximate planning zones before final wall offsets; verify clear sizes on a measured drawing.</text>
</svg>