<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc">
<title id="title">Furnished axonometric concept of a 28 by 40 foot budget three-bedroom home</title>
<desc id="desc">A cutaway axonometric diagram showing three bedrooms, one shared bathroom, living and dining spaces, kitchen, pantry and laundry in the same arrangement as the companion floor plan. Furniture is schematic and not to scale.</desc>
<defs><style>.label{font:700 15px Arial,sans-serif;fill:#203044}.small{font:13px Arial,sans-serif;fill:#536273}.wall{stroke:#34465a;stroke-width:3;stroke-linejoin:round}.bed{fill:#d8c7b2;stroke:#34465a;stroke-width:2}.sofa{fill:#82988b;stroke:#34465a;stroke-width:2}.cab{fill:#b58c61;stroke:#34465a;stroke-width:2}</style></defs>
<rect width="1100" height="900" fill="#fbfaf7"/>
<text x="550" y="48" text-anchor="middle" class="label" font-size="28">FURNISHED AXONOMETRIC VIEW · SAME 28 × 40 FT CONCEPT</text>
<text x="550" y="78" text-anchor="middle" class="small">Cutaway room zoning · furniture symbols are illustrative, not measured</text>
<!-- room floors in isometric coordinates: x=0..28, y=0..48 including porch -->
<g id="floors">
<polygon points="520,110 630,176 470,396 360,330" fill="#e9e3d8" class="wall"/>
