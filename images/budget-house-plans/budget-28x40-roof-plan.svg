<title id="title">28 by 40 foot gable roof concept plan</title>
<desc id="desc">A simple gable roof study for a rectangular 28 by 40 foot house, with a ridge running along the 40 foot length, roof slopes toward the two long eaves, gutters, and a separate lower porch canopy.</desc>
