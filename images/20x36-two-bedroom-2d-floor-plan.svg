<text x="335" y="785" font-size="17" font-weight="bold">UTILITY</text><text x="335" y="805" font-size="15">6' × 4'</text>
<text x="447" y="470" font-size="16" font-weight="bold" transform="rotate(-90 447 470)">3' SIDE PASSAGE</text>
<text x="250" y="935" font-size="16" font-weight="bold">FRONT / MAIN ENTRY</text>
</g>
