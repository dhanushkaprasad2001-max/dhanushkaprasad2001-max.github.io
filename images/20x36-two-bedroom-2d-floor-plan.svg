<g stroke="#172b46" stroke-width="2" fill="none"><path d="M0 -35 H500 M0 -45 V-25 M500 -45 V-25"/><path d="M-45 0 V900 M-55 0 H-35 M-55 900 H-35"/></g>
<g font-family="Arial" fill="#172b46" font-size="22" font-weight="bold"><text x="250" y="-48" text-anchor="middle">20'-0" overall width</text><text x="-78" y="450" text-anchor="middle" transform="rotate(-90 -78 450)">36'-0" overall length</text></g>
</g>
<text x="450" y="1090" text-anchor="middle" font-family="Arial" font-size="15" fill="#687789">Room clear sizes are illustrative; verify wall thicknesses, openings, site setbacks and all dimensions locally.</text>
