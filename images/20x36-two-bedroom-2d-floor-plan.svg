<text x="110" y="465" font-size="20" font-weight="bold">BEDROOM 1</text><text x="110" y="490" font-size="17">8' × 11'</text>
<text x="310" y="465" font-size="20" font-weight="bold">BEDROOM 2</text><text x="310" y="490" font-size="17">8' × 11'</text>
<text x="135" y="755" font-size="20" font-weight="bold">KITCHEN</text><text x="135" y="780" font-size="17">10' × 10'</text>
