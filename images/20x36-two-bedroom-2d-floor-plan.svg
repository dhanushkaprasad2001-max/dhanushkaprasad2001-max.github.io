<rect x="45" y="55" width="130" height="65" rx="12"/><rect x="45" y="55" width="40" height="65" rx="8"/>
<rect x="230" y="55" width="115" height="65" rx="8"/><rect x="235" y="175" width="95" height="45" rx="6"/>
