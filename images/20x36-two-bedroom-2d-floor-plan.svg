<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" role="img" aria-labelledby="t d">
<title id="t">Dimensioned concept floor plan, 20 by 36 feet</title><desc id="d">A 20 by 36 foot single-storey concept with a 16 by 10 foot living and dining room, two 8 by 11 foot bedrooms, a 10 by 10 foot kitchen, 6 by 7 foot bathroom, 6 by 4 foot utility room and a 3 foot side passage. Internal clear dimensions are approximate and the drawing is conceptual.</desc>
<rect width="900" height="1120" fill="#faf9f6"/>
<text x="450" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#172b46">20' × 36' TWO-BEDROOM HOME — 2D CONCEPT</text>
<text x="450" y="78" text-anchor="middle" font-family="Arial" font-size="17" fill="#536579">Top-down plan • dimensions in feet • not an approval / construction drawing</text>
<!-- footprint: 20 x 36, scaled 25 px/ft; interior clear zone approx 19 x 35 -->
<g transform="translate(190 145)">
