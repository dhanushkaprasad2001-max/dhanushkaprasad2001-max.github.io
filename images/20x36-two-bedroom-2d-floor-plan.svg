<g stroke="#fff" stroke-width="3"><path d="M90 4 H190 M280 4 H350 M4 80 V150 M4 360 V430 M85 906 H180 M491 110 V190 M491 360 V440 M491 660 V720"/></g>
<!-- furniture -->
