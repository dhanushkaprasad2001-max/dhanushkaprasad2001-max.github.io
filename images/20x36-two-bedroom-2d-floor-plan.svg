<rect x="260" y="535" width="150" height="175" fill="#e8eef8" stroke="#14243a" stroke-width="7"/>
<rect x="260" y="710" width="150" height="100" fill="#f5eade" stroke="#14243a" stroke-width="7"/>
<rect x="260" y="810" width="150" height="90" fill="#f2f0e9" stroke="#14243a" stroke-width="7"/>
<!-- doors: gaps are shown as white cuts with swing arcs -->
<path d="M165 260 L215 260 M165 260 A50 50 0 0 1 215 310" stroke="#fff" stroke-width="13" fill="none"/>
<path d="M365 260 L415 260 M365 260 A50 50 0 0 1 415 310" stroke="#fff" stroke-width="13" fill="none"/>
<path d="M410 380 L410 430 M410 380 A50 50 0 0 0 360 430" stroke="#fff" stroke-width="13" fill="none"/>
<path d="M260 650 L260 700 M260 650 A50 50 0 0 1 310 700" stroke="#fff" stroke-width="13" fill="none"/>
<path d="M410 575 L410 625 M410 575 A50 50 0 0 0 360 625" stroke="#fff" stroke-width="13" fill="none"/>
<path d="M410 735 L410 780 M410 735 A45 45 0 0 0 365 780" stroke="#fff" stroke-width="13" fill="none"/>
