<!-- internal zones -->
<rect x="10" y="10" width="400" height="250" fill="#e9eff7" stroke="#14243a" stroke-width="7"/>
<rect x="10" y="260" width="200" height="275" fill="#f6efe2" stroke="#14243a" stroke-width="7"/>
<rect x="210" y="260" width="200" height="275" fill="#edf3e9" stroke="#14243a" stroke-width="7"/>
<rect x="410" y="10" width="75" height="890" fill="#f0f1f3" stroke="#14243a" stroke-width="5"/>
