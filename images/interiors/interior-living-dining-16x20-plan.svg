<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1080" role="img" aria-labelledby="title desc">
<title id="title">Conceptual 16 by 20 foot tropical living and dining floor plan</title>
<desc id="desc">Top-down furniture plan with a north living zone, south dining zone, three-foot south entrance, four-foot kitchen opening on the east wall, a six-foot north window and a five-foot west window in the dining zone.</desc>
<defs>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#9a7135"/></marker>
 <pattern id="rug" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 9H18M9 0V18" stroke="#d7c8ad" stroke-width="1" opacity=".55"/></pattern>
</defs>
<rect width="980" height="1080" fill="#fbfaf7"/>
<text x="90" y="58" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#14243a">16 × 20 FT · LIVING + DINING</text>
<text x="90" y="88" font-family="Arial,sans-serif" font-size="14" fill="#697586">Concept plan · nominal internal dimensions · not a construction drawing</text>
<line x1="180" y1="125" x2="756" y2="125" stroke="#9a7135" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="468" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#9a7135">16 ft</text>
<line x1="820" y1="150" x2="820" y2="870" stroke="#9a7135" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="846" y="510" transform="rotate(90 846 510)" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#9a7135">20 ft</text>
<rect x="180" y="150" width="576" height="720" fill="#f3eee4"/>
<!-- zone guide -->
<line x1="180" y1="492" x2="756" y2="492" stroke="#c7b99f" stroke-width="2" stroke-dasharray="8 8"/>
<text x="205" y="185" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#8a6a3c">LIVING ZONE · 16 × 9.5 ft</text>
<text x="205" y="535" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#8a6a3c">DINING ZONE · 16 × 10.5 ft</text>
<!-- rug -->
<rect x="300" y="165" width="288" height="324" rx="12" fill="url(#rug)" stroke="#c8b89c" stroke-width="2"/>
<!-- sofa against east wall -->
<rect x="630" y="205" width="108" height="252" rx="15" fill="#c9b08c" stroke="#80694c" stroke-width="3"/>
<rect x="642" y="218" width="84" height="226" rx="12" fill="#e1d1b8" stroke="#9a8364" stroke-width="2"/>
<path d="M642 294H726M642 370H726" stroke="#b29a79" stroke-width="2"/>
<text x="684" y="335" transform="rotate(90 684 335)" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#594b39">7 ft sofa</text>
<!-- tv console on west wall -->
<rect x="197" y="258" width="45" height="180" rx="5" fill="#34475b" stroke="#14243a" stroke-width="2"/>
<rect x="203" y="278" width="33" height="92" rx="2" fill="#172b40"/>
<text x="218" y="390" transform="rotate(-90 218 390)" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">TV / console</text>
<!-- coffee table -->
<rect x="386" y="305" width="108" height="72" rx="8" fill="#b98e60" stroke="#806044" stroke-width="2"/>
<text x="440" y="346" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#fff" font-weight="700">Coffee table</text>
<!-- accent chair -->
<rect x="300" y="385" width="88" height="76" rx="13" fill="#b9c3b1" stroke="#73816e" stroke-width="2"/>
<rect x="311" y="395" width="66" height="55" rx="10" fill="#dce3d5"/>
<text x="344" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#425044">Chair</text>
<!-- dining table -->
<rect x="360" y="610" width="216" height="108" rx="8" fill="#b98e60" stroke="#806044" stroke-width="3"/>
<text x="468" y="662" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">6 × 3 ft</text>
<text x="468" y="684" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff">Dining table</text>
<!-- four dining chairs -->
<g fill="#d6d0c4" stroke="#7b7468" stroke-width="2">
 <rect x="300" y="620" width="48" height="42" rx="7"/><rect x="300" y="674" width="48" height="42" rx="7"/>
 <rect x="588" y="620" width="48" height="42" rx="7"/><rect x="588" y="674" width="48" height="42" rx="7"/>
</g>
<!-- sideboard -->
<rect x="702" y="510" width="54" height="180" rx="4" fill="#8e7559" stroke="#66523e" stroke-width="2"/>
<path d="M711 570H747M711 630H747" stroke="#e8d9c3" stroke-width="2"/>
<text x="729" y="600" transform="rotate(90 729 600)" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#fff">Sideboard</text>
<!-- wall lines with openings -->
<path d="M180 150H360 M576 150H756 M180 150V600 M180 780V870 M756 150V690 M756 834V870 M180 870H220 M328 870H756" fill="none" stroke="#34475b" stroke-width="14" stroke-linecap="square"/>
<!-- windows -->
<path d="M360 150H576" stroke="#6aa8bf" stroke-width="8"/>
<path d="M180 600V780" stroke="#6aa8bf" stroke-width="8"/>
<path d="M354 140V160M582 140V160M170 594H190M170 786H190" stroke="#6aa8bf" stroke-width="3"/>
<text x="468" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#397b95">6 ft window</text>
<text x="205" y="690" transform="rotate(-90 205 690)" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#397b95">5 ft window</text>
<!-- entrance door -->
<path d="M328 870V762" stroke="#9a7135" stroke-width="5"/>
<path d="M220 870A108 108 0 0 1 328 762" fill="none" stroke="#9a7135" stroke-width="2" stroke-dasharray="5 5"/>
<text x="274" y="915" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a7135">3 ft main entry</text>
<!-- kitchen opening -->
<path d="M756 690V834" stroke="#6b8f78" stroke-width="5"/>
<text x="785" y="760" transform="rotate(90 785 760)" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#52745d">4 ft opening to kitchen</text>
<!-- circulation note -->
<path d="M250 820C360 790 620 810 700 750" fill="none" stroke="#6b8f78" stroke-width="3" stroke-dasharray="9 7"/>
<text x="475" y="800" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#52745d">Keep a clear route between entry and kitchen</text>
<!-- north -->
<path d="M900 250V190M900 190L888 208M900 190L912 208" stroke="#14243a" stroke-width="3" fill="none"/>
<text x="900" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#14243a">N</text>
<text x="90" y="1000" font-family="Arial,sans-serif" font-size="13" fill="#697586">Furniture footprints are illustrative. Confirm actual furniture sizes, door swings, window openings and finished clearances on a measured site plan.</text>
<text x="90" y="1024" font-family="Arial,sans-serif" font-size="13" fill="#697586">Planning scale shown for communication only; not suitable for setting out or building work.</text>
</svg>