<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">Furnished axonometric concept of a 16 by 20 foot living and dining interior</title>
<desc id="desc">A cutaway vector illustration showing a warm neutral living room with a sofa, rug, coffee table and media console connected to a dining area with a timber table, four chairs, a sideboard, windows and layered lighting.</desc>
<defs>
 <linearGradient id="wallA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#e9e2d6"/></linearGradient>
 <linearGradient id="wallB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f2e9"/><stop offset="1" stop-color="#ddd4c6"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dfc9a9"/><stop offset="1" stop-color="#b99870"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="1100" height="760" fill="#fbfaf7"/>
<text x="60" y="58" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#14243a">FURNISHED AXONOMETRIC CONCEPT</text>
<text x="60" y="88" font-family="Arial,sans-serif" font-size="14" fill="#697586">16 × 20 ft · warm timber, soft neutrals and a connected dining zone</text>
<!-- room shell -->
<polygon points="150,470 465,300 925,455 610,625" fill="url(#floor)" stroke="#806c55" stroke-width="3"/>
<polygon points="150,470 465,300 465,80 150,250" fill="url(#wallA)" stroke="#a99c89" stroke-width="3"/>
<polygon points="465,300 925,455 925,235 465,80" fill="url(#wallB)" stroke="#a99c89" stroke-width="3"/>
<!-- wall window on left -->
<polygon points="215,435 350,362 350,220 215,293" fill="#a9d0dc" stroke="#597d8c" stroke-width="5"/>
<path d="M282 399V256M215 364L350 291" stroke="#eef8fa" stroke-width="5"/>
<!-- north window on back wall -->
<polygon points="570,335 765,400 765,285 570,220" fill="#a9d0dc" stroke="#597d8c" stroke-width="5"/>
<path d="M667 367V252" stroke="#eef8fa" stroke-width="5"/>
<!-- TV panel and console on left wall -->
<polygon points="165,390 220,360 220,270 165,300" fill="#34475b" stroke="#14243a" stroke-width="3"/>
<polygon points="165,430 240,389 240,367 165,408" fill="#755d45" stroke="#594a3a" stroke-width="2"/>
<!-- rug on living floor -->
<polygon points="315,470 505,365 725,440 535,545" fill="#eee5d7" stroke="#c9b99e" stroke-width="3"/>
<path d="M340 470L530 365M390 496L580 391M440 521L630 416" stroke="#d8c9b1" stroke-width="2" opacity=".8"/>
<!-- sofa on right side -->
<polygon points="655,375 790,420 790,540 655,495" fill="#b99f7b" stroke="#80694c" stroke-width="3"/>
<polygon points="655,375 790,420 790,460 655,415" fill="#d8c6aa" stroke="#80694c" stroke-width="2"/>
<polygon points="655,415 790,460 790,540 655,495" fill="#cdb99a" stroke="#80694c" stroke-width="2"/>
<path d="M700 390L700 510M748 406L748 526" stroke="#a58d6b" stroke-width="2"/>
<!-- coffee table -->
<polygon points="440,440 525,393 610,422 525,470" fill="#b8895d" stroke="#765538" stroke-width="3"/>
<path d="M454 450V485M596 431V466" stroke="#765538" stroke-width="6"/>
<rect x="510" y="415" width="32" height="16" rx="5" fill="#dfe5db" transform="rotate(-19 526 423)"/>
<!-- accent chair -->
<polygon points="320,390 385,355 440,374 375,410" fill="#8f9e86" stroke="#5e6d59" stroke-width="3"/>
<polygon points="320,390 375,410 375,455 320,435" fill="#75876f" stroke="#5e6d59" stroke-width="2"/>
<!-- dining zone table -->
<polygon points="365,565 520,480 700,540 545,625" fill="#9b704b" stroke="#67482e" stroke-width="3"/>
<path d="M400 548L400 610M665 535L665 595M530 620L530 660" stroke="#67482e" stroke-width="7"/>
<!-- dining chairs -->
<g fill="#d6c6ac" stroke="#78674f" stroke-width="3">
 <polygon points="300,555 350,528 390,542 340,570"/><polygon points="300,555 340,570 340,610 300,595"/>
 <polygon points="560,445 610,418 650,432 600,460"/><polygon points="560,445 600,460 600,500 560,485"/>
 <polygon points="570,650 620,623 660,637 610,665"/><polygon points="570,650 610,665 610,705 570,690"/>
 <polygon points="730,540 780,513 820,527 770,555"/><polygon points="730,540 770,555 770,595 730,580"/>
</g>
<!-- sideboard -->
<polygon points="790,485 850,452 850,530 790,563" fill="#8a6c4d" stroke="#59442f" stroke-width="3"/>
<path d="M803 496L839 476M803 520L839 500" stroke="#d8c6aa" stroke-width="3"/>
<!-- pendant -->
<path d="M690 90V190M660 190H720" stroke="#9a7135" stroke-width="3"/>
<path d="M670 190Q690 225 710 190Z" fill="#d9bd87" stroke="#9a7135" stroke-width="2"/>
<circle cx="690" cy="206" r="34" fill="#e8c98b" opacity=".18"/>
<!-- plants -->
<path d="M190 505L180 450M190 505L215 455M190 505L160 465M190 505L190 445" stroke="#54735a" stroke-width="7" stroke-linecap="round"/>
<path d="M166 505H214L207 535H174Z" fill="#9b7654" stroke="#6c523a" stroke-width="2"/>
<!-- labels -->
<rect x="60" y="650" width="980" height="70" rx="12" fill="#fff" stroke="#e8e4dc"/>
<text x="90" y="680" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#14243a">LIVING</text>
<text x="90" y="702" font-family="Arial,sans-serif" font-size="13" fill="#697586">7 ft sofa · 8 × 9 ft rug · media wall</text>
<text x="405" y="680" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#14243a">DINING</text>
<text x="405" y="702" font-family="Arial,sans-serif" font-size="13" fill="#697586">6 × 3 ft table · four seats · sideboard</text>
<text x="760" y="680" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#14243a">FINISH DIRECTION</text>
<text x="760" y="702" font-family="Arial,sans-serif" font-size="13" fill="#697586">Warm oak · soft white · muted green</text>
</svg>