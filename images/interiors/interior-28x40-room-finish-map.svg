<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Room-by-room interior finish coordination map</title>
<desc id="desc">A schematic finish schedule grouped into shared rooms, kitchen and utility, bedrooms, and bathroom, with corresponding floor, wall, joinery and lighting notes.</desc>
<rect width="1200" height="720" fill="#fbfaf7"/>
<text x="60" y="65" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#14243a">ROOM-BY-ROOM FINISH COORDINATION</text>
<text x="60" y="99" font-family="Arial,sans-serif" font-size="15" fill="#697586">A specification map, not a floor plan or a quantity schedule</text>
<g font-family="Arial,sans-serif">
<rect x="60" y="145" width="1080" height="115" rx="9" fill="#f1ede4" stroke="#ded6c8"/>
<rect x="60" y="145" width="18" height="115" rx="8" fill="#a9825b"/>
<text x="105" y="184" font-size="21" font-weight="700" fill="#14243a">SHARED ZONE</text>
<text x="105" y="216" font-size="15" fill="#586577">Living + dining + entry</text>
<rect x="400" y="168" width="155" height="65" rx="7" fill="#cfc9bd"/><text x="477" y="207" font-size="14" text-anchor="middle" fill="#14243a">Continuous floor</text>
