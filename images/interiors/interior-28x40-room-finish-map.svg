<rect x="750" y="303" width="155" height="65" rx="7" fill="#a9825b"/><text x="827" y="342" font-size="14" text-anchor="middle" fill="#fff">Moisture-suitable joinery</text>
<rect x="925" y="303" width="170" height="65" rx="7" fill="#e6d7b8"/><text x="1010" y="342" font-size="14" text-anchor="middle" fill="#14243a">Task + general light</text>
