<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" role="img" aria-labelledby="t d">
<title id="t">Axonometric furnished concept of the 20 by 36 foot two-bedroom home</title><desc id="d">An axonometric cutaway diagram illustrating the same compact home zoning: living and dining at the front, two bedrooms in the middle, a rear kitchen, bathroom, utility and a side passage. Furniture and room proportions are illustrative.</desc>
<defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="4" dy="8" stdDeviation="7" flood-color="#24364a" flood-opacity=".18"/></filter></defs>
<rect width="1100" height="900" fill="#faf9f6"/>
<text x="550" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#172b46">FURNISHED 3D-STYLE CUTAWAY CONCEPT</text>
<text x="550" y="78" text-anchor="middle" font-family="Arial" font-size="17" fill="#536579">Same room zoning as the 2D concept • roof removed to show interiors</text>
<!-- axonometric base: plan mapped with oblique transform -->
<g transform="translate(250 270) matrix(.72 .25 .42 -.30 0 0)" filter="url(#s)">
<rect x="0" y="0" width="500" height="900" fill="#e6e1d8" stroke="#27384a" stroke-width="12"/>
<!-- floor zones -->
<rect x="10" y="10" width="400" height="250" fill="#dce5ee" stroke="#596b7d" stroke-width="5"/>
<rect x="10" y="260" width="200" height="275" fill="#eee2ce" stroke="#596b7d" stroke-width="5"/>
<rect x="210" y="260" width="200" height="275" fill="#e1eadc" stroke="#596b7d" stroke-width="5"/>
<rect x="410" y="10" width="75" height="890" fill="#e5e7e9" stroke="#596b7d" stroke-width="4"/>
<rect x="160" y="535" width="250" height="250" fill="#dce9df" stroke="#596b7d" stroke-width="5"/>
<rect x="10" y="535" width="150" height="175" fill="#dce5f0" stroke="#596b7d" stroke-width="5"/>
<rect x="10" y="710" width="150" height="100" fill="#eee3d6" stroke="#596b7d" stroke-width="5"/>
<rect x="10" y="810" width="150" height="90" fill="#ece9df" stroke="#596b7d" stroke-width="5"/>
<!-- beds -->
<g fill="#9aafc2" stroke="#526a80" stroke-width="4"><rect x="35" y="300" width="105" height="180" rx="8"/><rect x="235" y="300" width="105" height="180" rx="8"/></g>
<g fill="#f7f4ed"><rect x="45" y="310" width="85" height="45" rx="8"/><rect x="245" y="310" width="85" height="45" rx="8"/></g>
<!-- living sofa and coffee table -->
<g fill="#b8aa9b" stroke="#75695e" stroke-width="4"><rect x="45" y="55" width="150" height="55" rx="10"/><rect x="45" y="55" width="45" height="130" rx="10"/></g>
<rect x="215" y="100" width="90" height="60" rx="8" fill="#b18b62" stroke="#6d563e" stroke-width="4"/>
<!-- dining table -->
<rect x="305" y="35" width="75" height="90" rx="5" fill="#a77b4f" stroke="#6d563e" stroke-width="4"/>
<g fill="#8e9aa5" stroke="#526a80" stroke-width="3"><rect x="290" y="45" width="18" height="25"/><rect x="380" y="45" width="18" height="25"/><rect x="290" y="100" width="18" height="25"/><rect x="380" y="100" width="18" height="25"/></g>
<!-- kitchen counters -->
<g fill="#bca98d" stroke="#77664e" stroke-width="4"><rect x="175" y="555" width="210" height="35"/><rect x="375" y="555" width="35" height="190"/></g>
<rect x="225" y="565" width="45" height="18" rx="3" fill="#a8c8d7" stroke="#5c7c8e" stroke-width="3"/>
<!-- bathroom / laundry -->
<g fill="#f8f8f6" stroke="#8094a3" stroke-width="4"><rect x="25" y="555" width="50" height="65" rx="10"/><ellipse cx="115" cy="570" rx="18" ry="24"/><rect x="95" y="635" width="42" height="35" rx="8"/></g>
<!-- passage runner -->
<path d="M447 30 V865" stroke="#c6b99e" stroke-width="38" opacity=".65"/>
</g>
<!-- labels and legend -->
<g font-family="Arial" fill="#172b46">
<text x="130" y="830" font-size="18" font-weight="bold">FRONT: LIVING + DINING</text>
<text x="430" y="830" font-size="18" font-weight="bold">MIDDLE: TWO BEDROOMS</text>
<text x="760" y="830" font-size="18" font-weight="bold">REAR: KITCHEN + BATH + UTILITY</text>
</g>
<text x="550" y="870" text-anchor="middle" font-family="Arial" font-size="15" fill="#687789">Illustrative axonometric diagram, not a photorealistic render or construction document.</text>
</svg>