<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 760" role="img" aria-labelledby="title desc">
<title id="title">10 by 12 foot bedroom furniture plan</title>
<desc id="desc">A dimensioned concept plan for a 10 by 12 foot bedroom with a double bed against the west wall, two bedside tables, a sliding wardrobe on the north wall, a combined desk and vanity on the east wall, an east-side entry door and windows on the north and south walls.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#687789"/></marker>
  <style>
    .dim{stroke:#687789;stroke-width:1.7;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
    .dimtxt{font:700 15px Arial,sans-serif;fill:#243247}
    .label{font:700 13px Arial,sans-serif;fill:#243247}
    .small{font:11px Arial,sans-serif;fill:#586577}
    .wall{stroke:#243247;stroke-width:14;fill:#fff;stroke-linejoin:round}
    .furn{stroke:#8a6b4d;stroke-width:2}
  </style>
</defs>
<rect width="820" height="760" fill="#f7f5f0"/>
<text x="410" y="38" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#14243a">10 × 12 ft Bedroom · 2D Furniture Plan</text>
<text x="410" y="62" text-anchor="middle" class="small">Assumed clear internal dimensions · north at top · furniture shown schematically</text>
<!-- Room shell -->
<rect x="190" y="130" width="420" height="504" class="wall"/>
<!-- North window opening and frame -->
<path d="M442 130H589" stroke="#fff" stroke-width="19"/>
<path d="M442 124H589M442 136H589M515 121V139" stroke="#6d9eb0" stroke-width="3" fill="none"/>
<text x="515" y="111" text-anchor="middle" class="small">3'-6" WINDOW</text>
<!-- South window opening and frame -->
<path d="M316 634H442" stroke="#fff" stroke-width="19"/>
<path d="M316 628H442M316 640H442M379 625V643" stroke="#6d9eb0" stroke-width="3" fill="none"/>
<text x="379" y="666" text-anchor="middle" class="small">3'-0" WINDOW</text>
<!-- East entry opening and door swing -->
<path d="M610 529V634" stroke="#fff" stroke-width="19"/>
<path d="M610 634L505 634" stroke="#b7793e" stroke-width="5" fill="none"/>
<path d="M505 634A105 105 0 0 1 610 529" stroke="#b7793e" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>
<text x="670" y="568" class="label">2'-6" ENTRY</text>
<text x="670" y="588" class="small">Door opens inward</text>
<!-- Wardrobe -->
<rect x="190" y="130" width="210" height="84" rx="3" fill="#d9c4a8" class="furn"/>
<path d="M295 132V212M300 132V212" stroke="#9a7956" stroke-width="2"/>
<circle cx="290" cy="171" r="2.5" fill="#76583a"/><circle cx="305" cy="171" r="2.5" fill="#76583a"/>
<text x="295" y="168" text-anchor="middle" class="label">SLIDING WARDROBE</text>
<text x="295" y="188" text-anchor="middle" class="small">5'-0" × 2'-0"</text>
<!-- Desk / vanity console on east wall -->
<rect x="547" y="151" width="63" height="168" rx="3" fill="#c9a77f" class="furn"/>
<rect x="555" y="166" width="47" height="138" fill="#eadbc9" stroke="#9a7956" stroke-width="1.5"/>
<path d="M555 188H602M555 282H602" stroke="#9a7956" stroke-width="1.5"/>
<text x="579" y="238" text-anchor="middle" class="label" transform="rotate(90 579 238)">DESK / VANITY</text>
<text x="579" y="238" text-anchor="middle" class="small" transform="rotate(90 579 238)"></text>
<!-- Chair zone -->
<rect x="442" y="172" width="105" height="126" fill="#e8f0f2" fill-opacity=".55" stroke="#6d9eb0" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="463" y="211" width="62" height="50" rx="9" fill="#b8c9cd" stroke="#6d8790" stroke-width="2"/>
<text x="494" y="238" text-anchor="middle" class="small">CHAIR</text>
<text x="494" y="316" text-anchor="middle" class="small">30" pull-back zone</text>
<!-- Bed: headboard west -->
<rect x="190" y="361" width="262.5" height="189" rx="9" fill="#d7c6b6" stroke="#8a6b4d" stroke-width="3"/>
<rect x="190" y="361" width="18" height="189" fill="#9d8067" stroke="#76583a" stroke-width="2"/>
<rect x="213" y="378" width="45" height="65" rx="7" fill="#fff8ef" stroke="#b7a28c" stroke-width="1.5"/>
<rect x="213" y="468" width="45" height="65" rx="7" fill="#fff8ef" stroke="#b7a28c" stroke-width="1.5"/>
<path d="M268 361V550" stroke="#b79c83" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="330" y="455" text-anchor="middle" class="label">DOUBLE BED</text>
<text x="330" y="477" text-anchor="middle" class="small">4'-6" × 6'-3" · HEAD TO WEST</text>
<!-- Bedside tables -->
<rect x="190" y="298" width="52.5" height="52.5" rx="3" fill="#c49a6c" class="furn"/>
<circle cx="216" cy="324" r="7" fill="#f4e7c9" stroke="#8a6b4d" stroke-width="1.5"/>
<text x="216" y="286" text-anchor="middle" class="small">15" TABLE</text>
<rect x="190" y="560.5" width="52.5" height="52.5" rx="3" fill="#c49a6c" class="furn"/>
<circle cx="216" cy="586" r="7" fill="#f4e7c9" stroke="#8a6b4d" stroke-width="1.5"/>
<text x="216" y="626" text-anchor="middle" class="small">15" TABLE</text>
<!-- Clear route label -->
<path d="M452.5 568H610" class="dim"/>
<text x="531" y="553" text-anchor="middle" class="dimtxt">3'-9" clear</text>
<!-- Wardrobe approach -->
<path d="M420 214V361" class="dim"/>
<text x="433" y="291" class="small">3'-6" approach</text>
<!-- Overall dimensions -->
<path d="M190 92V116M610 92V116M190 88H610" class="dim"/>
<text x="400" y="82" text-anchor="middle" class="dimtxt">10'-0" WIDTH</text>
<path d="M130 130H165M130 634H165M124 130V634" class="dim"/>
<text x="105" y="382" text-anchor="middle" class="dimtxt" transform="rotate(-90 105 382)">12'-0" DEPTH</text>
<!-- Orientation -->
<path d="M710 230V160M700 173L710 160L720 173" stroke="#243247" stroke-width="3" fill="none"/>
<text x="710" y="148" text-anchor="middle" class="label">N</text>
<text x="410" y="715" text-anchor="middle" class="small">Concept layout only · verify actual wall build-ups, furniture footprints and opening sizes before use</text>
</svg>