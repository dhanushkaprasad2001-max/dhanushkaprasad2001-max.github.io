<title id="title">Conceptual gable roof plan for a 26 by 34 foot home</title>
<desc id="desc">Top view of a simple gable roof with a north-south ridge line, roof slopes toward the east and west eaves, gutters along the long sides, and front and rear gable ends.</desc>
<defs><marker id="flow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#4b91b8"/></marker></defs>
