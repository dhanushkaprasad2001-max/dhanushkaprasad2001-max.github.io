<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1260" role="img" aria-labelledby="title desc">
<title id="title">Conceptual 26 by 34 foot two-bedroom home floor plan</title>
<desc id="desc">Top-down planning diagram with two 11 by 11 foot bedrooms, a 4 by 22 foot hall, a 5 by 8 foot bathroom, 6 by 8 foot laundry, 11 by 4 foot linen store, 11 by 10 foot kitchen and a 26 by 12 foot open living and dining zone. Doors and windows are marked schematically.</desc>
<defs>
 <marker id="dimArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9a7135"/></marker>
 <pattern id="porchHatch" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 16L16 0" stroke="#d5c6ad" stroke-width="1.4"/></pattern>
</defs>
<rect width="1020" height="1260" fill="#fbfaf7"/>
<text x="510" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#14243a">26 × 34 FT · TWO-BEDROOM HOME</text>
<text x="510" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#667085">Concept planning grid · front / south at bottom · not a construction drawing</text>
<g font-family="Arial,sans-serif" fill="#243247">
 <rect x="185" y="180" width="264" height="264" fill="#f1e9dc"/>
