<g transform="translate(900 190)" font-family="Arial,sans-serif" text-anchor="middle">
 <path d="M0 48V0 M0 0L-9 17 M0 0L9 17" stroke="#14243a" stroke-width="3" fill="none"/>
 <text x="0" y="-12" font-size="17" font-weight="700" fill="#14243a">N</text>
</g>
<g font-family="Arial,sans-serif" font-size="14" fill="#526174">
 <text x="880" y="330">Blue = window</text><text x="880" y="354">Gold = door swing</text>
 <text x="880" y="378">Front = south</text>
