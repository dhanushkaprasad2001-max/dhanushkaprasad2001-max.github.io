 <path d="M185 145H809"/><path d="M145 180V996"/>
</g>
<g font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#9a7135">
 <text x="497" y="133" text-anchor="middle">26 ft</text>
 <text x="126" y="588" text-anchor="middle" transform="rotate(-90 126 588)">34 ft</text>
</g>
