<text x="345" y="796" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#697586">approx. 14 × 12 ft</text>
<text x="665" y="770" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#8a6a3c">DINING ZONE</text>
<text x="665" y="796" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#697586">approx. 12 × 12 ft</text>
