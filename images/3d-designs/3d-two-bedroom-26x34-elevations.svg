 <path d="M125 340V390M315 340V390M150 340V390M290 340V390" stroke="#526174" stroke-width="3"/>
 <path d="M105 390V330M335 390V330" stroke="#526174" stroke-width="5"/>
 <path d="M0 392H440" stroke="#526174" stroke-width="3"/>
 <text x="220" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#667085">12 × 6 ft covered porch · front gable roof</text>
</g>
<!-- east side elevation -->
<g transform="translate(540 145)">
 <text x="200" y="-20" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#14243a">EAST SIDE</text>
 <polygon points="10,170 55,125 350,125 395,170" fill="#35485d" stroke="#26384d" stroke-width="5"/>
 <rect x="25" y="170" width="355" height="220" fill="#eee9df" stroke="#526174" stroke-width="4"/>
 <rect x="75" y="245" width="70" height="58" fill="#c6d7e1" stroke="#526174" stroke-width="4"/>
 <path d="M110 245V303M75 274H145" stroke="#fff" stroke-width="4"/>
