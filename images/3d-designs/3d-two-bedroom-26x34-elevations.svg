 <path d="M0 392H410" stroke="#526174" stroke-width="3"/>
 <text x="200" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#667085">Kitchen window · high service windows · shaded openings</text>
</g>
<!-- rear elevation -->
<g transform="translate(1010 145)">
 <text x="220" y="-20" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#14243a">REAR / NORTH</text>
 <polygon points="10,170 220,35 430,170" fill="#35485d" stroke="#26384d" stroke-width="5"/>
 <polygon points="25,170 220,45 415,170" fill="#566b7e"/>
 <rect x="30" y="170" width="380" height="220" fill="#eee9df" stroke="#526174" stroke-width="4"/>
