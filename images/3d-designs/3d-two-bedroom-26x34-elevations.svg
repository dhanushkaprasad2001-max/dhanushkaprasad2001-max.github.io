</g>
<!-- notes -->
<rect x="90" y="660" width="1320" height="190" rx="10" fill="#f0ece4" stroke="#ded5c7"/>
<g font-family="Arial,sans-serif" fill="#526174" font-size="17">
 <text x="125" y="705" font-weight="700" fill="#14243a">Coordinated exterior direction</text>
 <text x="125" y="745">• Warm off-white render or painted masonry, with a restrained timber-look accent at the entrance.</text>
 <text x="125" y="780">• Dark, low-glare roof finish and simple gutters; choose materials suitable for local weather and maintenance.</text>
 <text x="125" y="815">• Window sizes, sill heights, shading, privacy screens and openings must be adjusted to the actual site.</text>
</g>
<text x="750" y="910" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#667085">Concept illustrations only. Verify levels, dimensions, structure, weatherproofing and code requirements with qualified local professionals.</text>
</svg>