<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 960" role="img" aria-labelledby="title desc">
<title id="title">Conceptual front, east-side and rear elevations of a compact two-bedroom home</title>
<desc id="desc">Three architectural concept elevations showing a simple gable roof, covered front porch, shaded windows, side openings, rear service door and high-level bathroom and laundry windows. Drawings are illustrative, not measured construction elevations.</desc>
<rect width="1500" height="960" fill="#fbfaf7"/>
<text x="750" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#14243a">EXTERIOR ELEVATION CONCEPTS</text>
<text x="750" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#667085">One coordinated material language · not to scale · not construction documents</text>
<!-- front elevation -->
<g transform="translate(70 145)">
 <text x="220" y="-20" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#14243a">FRONT / SOUTH</text>
 <polygon points="10,170 220,35 430,170" fill="#35485d" stroke="#26384d" stroke-width="5"/>
 <polygon points="25,170 220,45 415,170" fill="#566b7e"/>
 <rect x="30" y="170" width="380" height="220" fill="#eee9df" stroke="#526174" stroke-width="4"/>
 <rect x="68" y="230" width="82" height="75" fill="#c6d7e1" stroke="#526174" stroke-width="4"/>
 <path d="M109 230V305M68 267H150" stroke="#fff" stroke-width="4"/>
 <rect x="280" y="230" width="82" height="75" fill="#c6d7e1" stroke="#526174" stroke-width="4"/>
