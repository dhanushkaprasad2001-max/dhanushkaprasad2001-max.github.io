<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Front, west side and rear elevation concepts for the 24 by 42 foot modern linear home</title>
<desc id="desc">Three schematic orthographic elevations showing a mono-pitch roof, shaded front porch, horizontal windows, side gallery screen and rear bedroom openings.</desc>
<rect width="1200" height="920" fill="#fbfaf7"/>
<text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172a3c">EXTERIOR ELEVATION CONCEPTS</text>
<text x="600" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#687789">A coordinated visual study — not a measured elevation or approved façade drawing</text>
<!-- Front -->
<g transform="translate(70 140)">
<text x="420" y="0" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#24374a">FRONT / ENTRY ELEVATION</text>
<path d="M60 100L780 170" stroke="#26394b" stroke-width="13" fill="none"/>
<rect x="70" y="170" width="700" height="220" fill="#eee9df" stroke="#26394b" stroke-width="4"/>
<rect x="125" y="225" width="205" height="105" fill="#a8c5cf" stroke="#344b5d" stroke-width="5"/>
<path d="M225 225V330 M125 278H330" stroke="#f6f7f5" stroke-width="5"/>
<rect x="390" y="215" width="150" height="175" fill="#b68c5b" stroke="#344b5d" stroke-width="5"/>
<circle cx="515" cy="300" r="5" fill="#f4e6c8"/>
<rect x="590" y="230" width="130" height="100" fill="#a8c5cf" stroke="#344b5d" stroke-width="5"/>
<path d="M655 230V330" stroke="#f6f7f5" stroke-width="4"/>
<path d="M365 205L365 390 M565 210L565 390" stroke="#c4b7a3" stroke-width="4"/>
<path d="M350 165L570 185L570 200L350 180Z" fill="#9caaad" stroke="#26394b" stroke-width="3"/>
<path d="M30 392H810" stroke="#64717a" stroke-width="3"/>
<text x="420" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#687789">Light render · shaded entry canopy · simple window rhythm · timber-look screen</text>
</g>
<!-- West side -->
<g transform="translate(70 590)">
<text x="420" y="0" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#24374a">WEST SIDE ELEVATION</text>
<path d="M40 90L820 165" stroke="#26394b" stroke-width="12" fill="none"/>
<path d="M50 165H810V330H50Z" fill="#eee9df" stroke="#26394b" stroke-width="4"/>
<rect x="105" y="220" width="130" height="72" fill="#a8c5cf" stroke="#344b5d" stroke-width="4"/>
<rect x="300" y="220" width="120" height="72" fill="#a8c5cf" stroke="#344b5d" stroke-width="4"/>
<rect x="490" y="220" width="180" height="72" fill="#a8c5cf" stroke="#344b5d" stroke-width="4"/>
<path d="M50 330H810" stroke="#64717a" stroke-width="3"/>
<text x="420" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#687789">West openings are illustrative; add shading and adjust glazing to actual sun and privacy conditions</text>
</g>
<!-- rear -->
<g transform="translate(900 150)">
<text x="130" y="0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#24374a">REAR</text>
<path d="M10 95L250 125" stroke="#26394b" stroke-width="11" fill="none"/>
<rect x="18" y="125" width="235" height="265" fill="#eee9df" stroke="#26394b" stroke-width="4"/>
<rect x="45" y="195" width="95" height="100" fill="#a8c5cf" stroke="#344b5d" stroke-width="4"/>
<rect x="165" y="195" width="65" height="65" fill="#a8c5cf" stroke="#344b5d" stroke-width="4"/>
<path d="M18 390H253" stroke="#64717a" stroke-width="3"/>
<text x="135" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#687789">Bedroom and bath windows</text>
</g>
<text x="600" y="890" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#8a5b2b">Final levels, opening sizes, shading, structure and boundary clearances require site-specific professional design</text>
</svg>