<title id="title">24 by 42 foot modern home with a central daylit gallery floor plan</title>
<desc id="desc">Schematic top-down plan with living and dining rooms at the front, a flexible study and kitchen in the middle, two bedrooms and a bathroom at the rear, and a four-foot central gallery.</desc>
