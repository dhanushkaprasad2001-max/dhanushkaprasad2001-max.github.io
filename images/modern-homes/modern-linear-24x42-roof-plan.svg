<text x="500" y="420" transform="rotate(-90 500 420)" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#2f7894">RAISED CENTRAL CLERESTORY</text>
<path d="M250 165V695" stroke="#2f7894" stroke-width="10"/>
<path d="M750 165V695" stroke="#2f7894" stroke-width="10"/>
