<text x="640" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#34485a">EAST ROOF PLANE</text>
<text x="500" y="780" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#526477">External gutters and downpipes on both side eaves</text>
