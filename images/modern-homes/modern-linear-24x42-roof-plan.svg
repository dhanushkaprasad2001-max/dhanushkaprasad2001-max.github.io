<text x="500" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172a3c">RAISED CLERESTORY ROOF · CONCEPT PLAN</text>
<text x="500" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#687789">24 × 42 ft nominal building grid · roof fall shown diagrammatically</text>
<rect x="215" y="130" width="570" height="600" rx="3" fill="#e6e9e5" stroke="#26394b" stroke-width="5"/>
<rect x="250" y="165" width="500" height="530" fill="#f7f5ef" stroke="#7b8992" stroke-width="2" stroke-dasharray="9 8"/>
