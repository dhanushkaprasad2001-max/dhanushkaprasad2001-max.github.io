<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="title desc">
  <title id="title">Compact two-bedroom home furniture layout concept</title>
  <desc id="desc">An illustrative single-storey two-bedroom home plan showing a primary bedroom with a double bed and wardrobes, a second bedroom, bathroom fixtures, a central hall, a living and dining area, kitchen counters, laundry appliances and an entry zone. The drawing is not to scale.</desc>
  <defs>
    <style>
      .wall{stroke:#14243a;stroke-width:7;fill:none;stroke-linejoin:miter}
      .partition{stroke:#14243a;stroke-width:3;fill:none}
      .room-label{font-family:Arial,sans-serif;fill:#14243a;text-anchor:middle}
      .small{font-family:Arial,sans-serif;fill:#64748b;text-anchor:middle}
      .furniture{fill:#fff;stroke:#718096;stroke-width:2}
      .detail{fill:none;stroke:#718096;stroke-width:2}
      .gold{stroke:#c59b55;stroke-width:7;stroke-linecap:round;fill:none}
    </style>
  </defs>
  <rect width="800" height="680" fill="#f7f5f0"/>
  <text x="400" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#9a7135">DREAMHOME PLANS · FURNITURE LAYOUT CONCEPT</text>

  <!-- Room zones -->
  <rect x="80" y="75" width="640" height="500" fill="#fff"/>
  <rect x="84" y="79" width="266" height="186" fill="#edf2f7"/>
  <rect x="350" y="79" width="190" height="186" fill="#edf2f7"/>
  <rect x="540" y="79" width="176" height="186" fill="#f5eee2"/>
  <rect x="84" y="265" width="632" height="105" fill="#f7f5f0"/>
  <rect x="84" y="370" width="376" height="201" fill="#f7f5f0"/>
  <rect x="460" y="370" width="256" height="140" fill="#f5eee2"/>
  <rect x="460" y="510" width="128" height="61" fill="#edf2f7"/>
  <rect x="588" y="510" width="128" height="61" fill="#f5eee2"/>

  <!-- Main walls and partitions -->
  <rect x="80" y="75" width="640" height="500" class="wall"/>
  <path d="M350 79V265 M540 79V265 M84 265H716 M84 370H716 M460 370V571 M460 510H716 M588 510V571" class="partition"/>

  <!-- Primary bedroom furniture -->
  <text x="217" y="103" class="room-label" font-size="16" font-weight="700">PRIMARY BEDROOM</text>
  <text x="217" y="121" class="small" font-size="12">12 × 13 ft · suggested</text>
  <rect x="147" y="137" width="140" height="83" rx="5" class="furniture"/>
  <rect x="154" y="143" width="58" height="24" rx="4" fill="#e7edf4" stroke="#9aa8b8"/>
  <rect x="222" y="143" width="58" height="24" rx="4" fill="#e7edf4" stroke="#9aa8b8"/>
  <path d="M217 168V220" class="detail"/>
  <rect x="105" y="143" width="29" height="31" rx="3" class="furniture"/>
  <circle cx="119.5" cy="158.5" r="4" fill="#c59b55"/>
  <rect x="300" y="143" width="29" height="31" rx="3" class="furniture"/>
  <circle cx="314.5" cy="158.5" r="4" fill="#c59b55"/>
  <rect x="104" y="226" width="92" height="25" rx="2" class="furniture"/>
  <path d="M150 226V251" class="detail"/>
  <text x="150" y="243" class="small" font-size="9">WARDROBE</text>

  <!-- Bedroom 2 furniture -->
  <text x="445" y="103" class="room-label" font-size="16" font-weight="700">BEDROOM 2</text>
  <text x="445" y="121" class="small" font-size="12">10 × 11 ft · suggested</text>
  <rect x="385" y="139" width="105" height="70" rx="5" class="furniture"/>
  <rect x="392" y="145" width="42" height="20" rx="4" fill="#e7edf4" stroke="#9aa8b8"/>
  <rect x="440" y="145" width="42" height="20" rx="4" fill="#e7edf4" stroke="#9aa8b8"/>
  <rect x="365" y="225" width="70" height="24" rx="2" class="furniture"/>
  <path d="M400 225V249" class="detail"/>
  <text x="400" y="241" class="small" font-size="9">STORAGE</text>
  <rect x="462" y="220" width="58" height="28" rx="2" class="furniture"/>
  <circle cx="491" cy="255" r="8" class="detail"/>

  <!-- Bathroom fixtures -->
  <text x="628" y="103" class="room-label" font-size="16" font-weight="700">BATHROOM</text>
  <text x="628" y="121" class="small" font-size="12">8 × 6 ft · suggested</text>
  <rect x="558" y="137" width="67" height="69" rx="3" fill="#fff" stroke="#9aa8b8" stroke-width="2"/>
  <path d="M563 142L620 201 M620 142L563 201" class="detail"/>
  <text x="591" y="217" class="small" font-size="9">SHOWER</text>
  <rect x="645" y="139" width="55" height="28" rx="4" class="furniture"/>
  <ellipse cx="672" cy="153" rx="11" ry="7" fill="#edf2f7" stroke="#718096" stroke-width="1.5"/>
  <rect x="652" y="188" width="42" height="52" rx="12" class="furniture"/>
  <ellipse cx="673" cy="205" rx="12" ry="15" fill="#edf2f7" stroke="#718096" stroke-width="1.5"/>
  <text x="673" y="252" class="small" font-size="9">WC</text>

  <!-- Central hall -->
  <text x="397" y="292" class="room-label" font-size="17" font-weight="700">CENTRAL HALL</text>
  <text x="397" y="313" class="small" font-size="12">Shared access zone</text>
  <rect x="278" y="329" width="58" height="24" rx="2" class="furniture"/>
  <path d="M307 329V353" class="detail"/>
  <text x="307" y="345" class="small" font-size="9">CONSOLE</text>
  <path d="M365 329H430" stroke="#c59b55" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
  <text x="397" y="359" class="small" font-size="9">CLEAR WALKWAY</text>

  <!-- Living and dining furniture -->
  <text x="272" y="393" class="room-label" font-size="18" font-weight="700">LIVING + DINING</text>
  <text x="272" y="411" class="small" font-size="12">15 × 18 ft · suggested</text>
  <rect x="110" y="433" width="136" height="49" rx="8" class="furniture"/>
  <path d="M155 433V482 M201 433V482" class="detail"/>
  <rect x="117" y="421" width="122" height="13" rx="5" fill="#e7edf4" stroke="#718096" stroke-width="1.5"/>
  <rect x="147" y="492" width="76" height="32" rx="4" class="furniture"/>
  <rect x="100" y="500" width="31" height="46" rx="6" class="furniture"/>
  <path d="M108 507H123" class="detail"/>
  <rect x="282" y="449" width="116" height="65" rx="5" class="furniture"/>
  <path d="M340 449V514 M282 481.5H398" class="detail"/>
  <rect x="296" y="433" width="23" height="13" rx="3" class="furniture"/>
  <rect x="361" y="433" width="23" height="13" rx="3" class="furniture"/>
  <rect x="296" y="517" width="23" height="13" rx="3" class="furniture"/>
  <rect x="361" y="517" width="23" height="13" rx="3" class="furniture"/>
  <text x="340" y="485" class="small" font-size="10">DINING</text>
  <text x="178" y="551" class="small" font-size="10">SOFA + COFFEE TABLE</text>

  <!-- Kitchen -->
  <text x="588" y="393" class="room-label" font-size="18" font-weight="700">KITCHEN</text>
  <text x="588" y="411" class="small" font-size="12">10 × 11 ft · suggested</text>
  <rect x="483" y="424" width="154" height="25" rx="2" class="furniture"/>
  <rect x="483" y="424" width="44" height="25" fill="#e7edf4" stroke="#718096" stroke-width="1.5"/>
  <ellipse cx="505" cy="436" rx="9" ry="7" fill="none" stroke="#718096" stroke-width="1.5"/>
  <rect x="538" y="424" width="37" height="25" fill="#f5eee2" stroke="#718096" stroke-width="1.5"/>
  <circle cx="548" cy="432" r="3" fill="#718096"/><circle cx="565" cy="441" r="3" fill="#718096"/>
  <rect x="650" y="424" width="45" height="69" rx="2" class="furniture"/>
  <path d="M650 458H695" class="detail"/>
  <text x="672" y="448" class="small" font-size="9">FRIDGE</text>
  <rect x="548" y="466" width="76" height="27" rx="2" class="furniture"/>
  <text x="586" y="483" class="small" font-size="9">ISLAND</text>

  <!-- Laundry and entry -->
  <text x="524" y="526" class="room-label" font-size="13" font-weight="700">LAUNDRY</text>
  <rect x="470" y="535" width="47" height="28" rx="3" class="furniture"/>
  <circle cx="493.5" cy="549" r="9" class="detail"/>
  <rect x="527" y="535" width="47" height="28" rx="3" class="furniture"/>
  <circle cx="550.5" cy="549" r="9" class="detail"/>
  <text x="652" y="526" class="room-label" font-size="13" font-weight="700">ENTRY</text>
  <rect x="606" y="537" width="92" height="20" rx="2" class="furniture"/>
  <text x="652" y="551" class="small" font-size="9">SHOE STORAGE</text>

  <!-- Window markers (illustrative only) -->
  <path d="M150 79H218 M396 79H450 M578 79H638 M84 430V478 M716 410V458" class="gold"/>
  <g font-family="Arial,sans-serif" font-size="10" fill="#9a7135">
    <text x="184" y="68" text-anchor="middle">WINDOW</text>
    <text x="423" y="68" text-anchor="middle">WINDOW</text>
    <text x="608" y="68" text-anchor="middle">WINDOW</text>
  </g>

  <g fill="#64748b" font-family="Arial,sans-serif" font-size="12">
    <text x="400" y="615" text-anchor="middle">Furniture positions and window markers are illustrative, not measured.</text>
    <text x="400" y="638" text-anchor="middle">Not to scale · verify all openings, dimensions and clearances with local professionals.</text>
  </g>
</svg>