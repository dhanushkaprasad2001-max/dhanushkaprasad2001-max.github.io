<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual two-bedroom single-storey home layout</title>
  <desc id="desc">A simple room-adjacency diagram showing a primary bedroom, second bedroom, bathroom, central hall, open living and dining room, kitchen, laundry and entry.</desc>
  <rect width="800" height="680" fill="#f7f5f0"/>
  <text x="400" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#9a7135">DREAMHOME PLANS · CONCEPT STUDY</text>
  <rect x="80" y="75" width="640" height="500" fill="#ffffff" stroke="#14243a" stroke-width="8"/>
  <rect x="84" y="79" width="266" height="186" fill="#edf2f7" stroke="#14243a" stroke-width="3"/>
  <rect x="350" y="79" width="190" height="186" fill="#edf2f7" stroke="#14243a" stroke-width="3"/>
  <rect x="540" y="79" width="176" height="186" fill="#f5eee2" stroke="#14243a" stroke-width="3"/>
  <rect x="254" y="265" width="286" height="105" fill="#f7f5f0" stroke="#14243a" stroke-width="3"/>
  <rect x="84" y="370" width="376" height="201" fill="#f7f5f0" stroke="#14243a" stroke-width="3"/>
  <rect x="460" y="370" width="256" height="140" fill="#f5eee2" stroke="#14243a" stroke-width="3"/>
  <rect x="460" y="510" width="128" height="61" fill="#edf2f7" stroke="#14243a" stroke-width="3"/>
  <rect x="588" y="510" width="128" height="61" fill="#f5eee2" stroke="#14243a" stroke-width="3"/>
  <g font-family="Arial,sans-serif" fill="#14243a" text-anchor="middle">
    <text x="217" y="151" font-size="20" font-weight="700">PRIMARY</text>
    <text x="217" y="177" font-size="18">BEDROOM</text>
    <text x="217" y="204" font-size="15" fill="#64748b">12 × 13 ft · suggested</text>
    <text x="445" y="151" font-size="19" font-weight="700">BEDROOM 2</text>
    <text x="445" y="181" font-size="15" fill="#64748b">10 × 11 ft · suggested</text>
    <text x="628" y="151" font-size="19" font-weight="700">BATH</text>
    <text x="628" y="181" font-size="15" fill="#64748b">8 × 6 ft · suggested</text>
    <text x="397" y="308" font-size="19" font-weight="700">CENTRAL HALL</text>
    <text x="397" y="333" font-size="14" fill="#64748b">Shared access zone</text>
    <text x="272" y="449" font-size="22" font-weight="700">LIVING + DINING</text>
    <text x="272" y="480" font-size="16" fill="#64748b">Open shared space</text>
    <text x="588" y="425" font-size="21" font-weight="700">KITCHEN</text>
    <text x="588" y="454" font-size="15" fill="#64748b">10 × 11 ft · suggested</text>
    <text x="524" y="535" font-size="15" font-weight="700">LAUNDRY</text>
    <text x="652" y="535" font-size="15" font-weight="700">ENTRY</text>
  </g>
  <g stroke="#c59b55" stroke-width="7" stroke-linecap="round">
    <path d="M125 79h70 M395 79h58 M575 79h60"/>
    <path d="M84 430v60 M716 405v55"/>
  </g>
  <g fill="#64748b" font-family="Arial,sans-serif" font-size="13">
    <text x="400" y="615" text-anchor="middle">Illustrative room relationships only — diagram is not to scale.</text>
    <text x="400" y="638" text-anchor="middle">Have all dimensions, structure, openings and local code requirements professionally checked.</text>
  </g>
</svg>