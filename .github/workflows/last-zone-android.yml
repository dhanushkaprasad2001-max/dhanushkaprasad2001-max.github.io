name: Build LAST ZONE Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "last-zone/**"
      - ".github/workflows/last-zone-android.yml"
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Import project
        run: godot --headless --editor --path last-zone --import
      - name: Export Android debug APK
        run: godot --headless --path last-zone --export-debug "Android" last-zone/build/last-zone-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: last-zone-debug-apk
          path: last-zone/build/last-zone-debug.apk
          if-no-files-found: error
