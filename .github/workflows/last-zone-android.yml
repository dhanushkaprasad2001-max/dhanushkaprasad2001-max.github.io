name: Build LAST ZONE Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "last-zone/**"
      - ".github/workflows/last-zone-android.yml"
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Configure Godot Android export
        run: |
          mkdir -p ~/.config/godot ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          EOF
          java -version
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
      - name: Install Android deep-link build template and AppLinks bridge
        run: |
          set -euo pipefail
          mkdir -p last-zone/android/plugins
          curl -fL --retry 3 https://github.com/timoschwarzer/godot-applinks/releases/download/1.0.0/AppLinks.aar -o last-zone/android/plugins/AppLinks.aar
          curl -fL --retry 3 https://github.com/timoschwarzer/godot-applinks/releases/download/1.0.0/AppLinks.gdap -o last-zone/android/plugins/AppLinks.gdap
          godot --headless --path last-zone --install-android-build-template --export-debug "Android" /tmp/last-zone-template-install.apk
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("last-zone/android/build/AndroidManifest.xml"), Path("last-zone/android/AndroidManifest.xml")]
          manifest = next((p for p in candidates if p.exists()), None)
          if manifest is None:
              raise SystemExit("Godot Android template did not create its AndroidManifest.xml")
          data = manifest.read_text()
          if "com.lastzone.battleroyale" not in data:
              intent = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="com.lastzone.battleroyale" android:host="auth" android:path="/callback" />
                  </intent-filter>
          '''
              data, count = re.subn(r"</activity>", intent + "\\n            </activity>", data, count=1)
              if count != 1:
                  raise SystemExit("Could not insert LAST ZONE auth deep-link intent filter")
              manifest.write_text(data)
          print("LAST ZONE auth callback intent filter installed in", manifest)
          PY
      - name: Verify Godot Android export prerequisites
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          ls -la ~/.local/share/godot/export_templates/4.4.1.stable || true
          ls -la "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          cat ~/.config/godot/editor_settings-4.4.tres
          godot --headless --editor --path last-zone --quit --verbose 2>&1 | tee /tmp/godot-editor-check.log
      - name: Import project
        run: godot --headless --editor --path last-zone --import
      - name: Validate project configuration invariants
        run: |
          set -o pipefail
          godot --headless --path last-zone --quit-after 10 -- --self-test 2>&1 | tee /tmp/last-zone-self-test.log
          grep -q "LAST ZONE SELF TEST: all project configuration invariants passed" /tmp/last-zone-self-test.log
      - name: Smoke test game startup
        run: |
          set -o pipefail
          godot --headless --path last-zone --quit-after 5 2>&1 | tee /tmp/last-zone-client-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Failed to load|Invalid call" /tmp/last-zone-client-smoke.log; then
            echo "Game startup smoke test reported an error."
            exit 1
          fi
      - name: Smoke test all six selectable map builders
        run: |
          set -euo pipefail
          for map in ZONE_ISLAND DUST_LAND FROST_PEAK NEON_CITY DARK_JUNGLE WILD_JUNGLE; do
            echo "Testing map builder: $map"
            LAST_ZONE_MAP="$map" godot --headless --path last-zone --quit-after 10 -- --server 2>&1 | tee "/tmp/last-zone-map-$map.log"
            grep -q "LAST ZONE MAP BUILD: $map " "/tmp/last-zone-map-$map.log"
            if grep -Eiq "SCRIPT ERROR|Parse Error|Failed to load|Invalid call" "/tmp/last-zone-map-$map.log"; then
              echo "Map builder failed: $map"
              exit 1
            fi
          done
          echo "All six LAST ZONE map builders passed headless startup checks."
      - name: Export Android debug APK
        run: |
          mkdir -p last-zone/build
          set -o pipefail
          godot --headless --verbose --path last-zone --export-debug "Android" build/last-zone-debug.apk 2>&1 | tee /tmp/godot-export.log
          grep -Ei "error|missing|not found|invalid|android|template|keystore" /tmp/godot-export.log | tail -100
          test -s last-zone/build/last-zone-debug.apk
          unzip -t last-zone/build/last-zone-debug.apk >/tmp/last-zone-apk-integrity.log
          tail -2 /tmp/last-zone-apk-integrity.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: last-zone-debug-apk
          path: last-zone/build/last-zone-debug.apk
          if-no-files-found: error
      - name: Export Linux dedicated server
        run: |
          mkdir -p "$GITHUB_WORKSPACE/last-zone/build"
          set -o pipefail
          godot --headless --verbose --path last-zone --export-release "Linux Dedicated Server" "$GITHUB_WORKSPACE/last-zone/build/last-zone-server.x86_64" 2>&1 | tee /tmp/godot-server-export.log
          echo "Dedicated server export output:"
          ls -lah "$GITHUB_WORKSPACE/last-zone/build"
          test -s "$GITHUB_WORKSPACE/last-zone/build/last-zone-server.x86_64"
      - name: Multiplayer integration test with two ENet test clients
        run: |
          SERVER_BIN="$GITHUB_WORKSPACE/last-zone/build/last-zone-server.x86_64"
          test -s "$SERVER_BIN"
          chmod 755 "$SERVER_BIN"
          export LAST_ZONE_PORT=27016
          export LAST_ZONE_TEST_MODE=1
          export LAST_ZONE_VEHICLE_TEST_MODE=1
          # Keep the packaged Linux server as an artifact, but run the integration suite
          # with the same Godot runtime used to export it until the standalone binary
          # startup is verified independently on the runner image.
          file "$SERVER_BIN"
          ldd "$SERVER_BIN" || true
          godot --headless --path last-zone -- --server > /tmp/last-zone-server-smoke.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if grep -q "listening on UDP 27016" /tmp/last-zone-server-smoke.log; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/last-zone-server-smoke.log
              echo "Dedicated server exited before listening."
              exit 1
            fi
            sleep 0.2
          done
          grep -q "LAST ZONE dedicated server listening on UDP 27016 (capacity 50)" /tmp/last-zone-server-smoke.log
          godot --headless --path last-zone -- --network-test-client > /tmp/last-zone-client-1.log 2>&1 &
          CLIENT_ONE=$!
          godot --headless --path last-zone -- --network-test-client > /tmp/last-zone-client-2.log 2>&1 &
          CLIENT_TWO=$!
          CLIENT_ONE_STATUS=0
          CLIENT_TWO_STATUS=0
          wait "$CLIENT_ONE" || CLIENT_ONE_STATUS=$?
          wait "$CLIENT_TWO" || CLIENT_TWO_STATUS=$?
          cat /tmp/last-zone-client-1.log
          cat /tmp/last-zone-client-2.log
          if [ "$CLIENT_ONE_STATUS" -ne 0 ] || [ "$CLIENT_TWO_STATUS" -ne 0 ]; then
            echo "ENet integration client exit codes: $CLIENT_ONE_STATUS, $CLIENT_TWO_STATUS"
            echo "Dedicated server diagnostic log:"
            cat /tmp/last-zone-server-smoke.log
            exit 1
          fi
          grep -q "NETWORK TEST: server-authoritative Gloo Wall spawn replication passed" /tmp/last-zone-client-1.log /tmp/last-zone-client-2.log
          grep -q "NETWORK TEST: server-authoritative Gloo Wall charge deduction passed" /tmp/last-zone-client-1.log /tmp/last-zone-client-2.log
          grep -q "client joined, readied, started match and received server-authoritative damage" /tmp/last-zone-client-1.log
          grep -q "client joined, readied, started match and received server-authoritative damage" /tmp/last-zone-client-2.log
          grep -q "NETWORK TEST: authoritative vehicle movement and exit passed" /tmp/last-zone-client-1.log /tmp/last-zone-client-2.log
          echo "Two-client ENet lobby and authoritative damage integration test passed."
          # Verify the advertised 50-player server admission limit with 50 independent ENet clients.
          sleep 2
          PIDS=()
          for batch in 0 1 2 3 4; do
            first=$((batch * 10 + 1))
            last=$((first + 9))
            for client in $(seq "$first" "$last"); do
              LAST_ZONE_PORT=27016 godot --headless --path last-zone -- --capacity-test-client > "/tmp/last-zone-capacity-$client.log" 2>&1 &
              PIDS+=("$!")
            done
            sleep 0.2
          done
          # Each accepted client holds its slot after all 50 are connected.
          ready=0
          for attempt in $(seq 1 120); do
            ready=$(grep -l "50/50 connected" /tmp/last-zone-capacity-*.log 2>/dev/null | wc -l)
            if [ "$ready" -eq 50 ]; then break; fi
            sleep 0.1
          done
          if [ "$ready" -ne 50 ]; then
            echo "Expected all 50 clients to hold their slots, got $ready."
            grep -H -E "ERROR|SCRIPT ERROR|CAPACITY TEST" /tmp/last-zone-capacity-*.log || true
            exit 1
          fi
          LAST_ZONE_PORT=27016 LAST_ZONE_EXPECT_REJECTION=1 godot --headless --path last-zone -- --capacity-test-client > /tmp/last-zone-capacity-overflow.log 2>&1
          cat /tmp/last-zone-capacity-overflow.log
          grep -q "CAPACITY TEST: overflow client rejected" /tmp/last-zone-capacity-overflow.log
          capacity_failures=0
          for pid in "${PIDS[@]}"; do
            if ! wait "$pid"; then capacity_failures=$((capacity_failures + 1)); fi
          done
          if [ "$capacity_failures" -ne 0 ]; then
            echo "$capacity_failures of the 50 admitted clients failed."
            grep -H -E "ERROR|SCRIPT ERROR|CAPACITY TEST" /tmp/last-zone-capacity-*.log || true
            exit 1
          fi
          admitted=$(grep -l "CAPACITY TEST: player admitted" /tmp/last-zone-capacity-*.log | wc -l)
          if [ "$admitted" -ne 50 ]; then
            echo "Expected 50 admitted clients, got $admitted."
            grep -H -E "ERROR|SCRIPT ERROR|CAPACITY TEST" /tmp/last-zone-capacity-*.log || true
            exit 1
          fi
          echo "50-client ENet admission and overflow rejection test passed."
          # All capacity-test clients have now disconnected; confirm the empty lobby restores vehicles.
          for attempt in $(seq 1 30); do
            if grep -q "VEHICLE TEST: fleet reset passed" /tmp/last-zone-server-smoke.log; then break; fi
            sleep 0.2
          done
          grep -q "VEHICLE TEST: fleet reset passed" /tmp/last-zone-server-smoke.log
          echo "Vehicle fleet reset after the final peer disconnected passed."
      - name: Upload dedicated server
        uses: actions/upload-artifact@v4
        with:
          name: last-zone-linux-dedicated-server
          path: last-zone/build/last-zone-server.x86_64
          if-no-files-found: error
