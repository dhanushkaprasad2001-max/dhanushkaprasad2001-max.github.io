<title id="title">30 by 40 foot tropical modern courtyard home concept floor plan</title>
<desc id="desc">Conceptual dimensioned plan showing a 12 by 16 foot main bedroom, 12 by 12 foot bedroom, 12 by 12 foot flexible study, 3 foot hall, 15 by 14 foot living room, dining area, kitchen, bathroom, laundry, store and 9 by 9 foot open courtyard.</desc>
