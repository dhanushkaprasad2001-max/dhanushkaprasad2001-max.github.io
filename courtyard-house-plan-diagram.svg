<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
<title id="title">Diagrammatic 30 by 40 foot modern courtyard house plan</title>
<desc id="desc">A conceptual zoning plan showing a front living and dining area, kitchen, three bedrooms, a central open-to-sky courtyard, two bathrooms and a rear utility zone. The room dimensions are preliminary targets and the diagram is not to scale.</desc>
<defs>
  <style>
    .outer{fill:#fff;stroke:#182b40;stroke-width:5}
    .room{fill:#f7f5ef;stroke:#526477;stroke-width:2.5}
    .sleep{fill:#edf3ef;stroke:#526477;stroke-width:2.5}
    .service{fill:#f2eee7;stroke:#526477;stroke-width:2.5}
    .court{fill:#e3f1e5;stroke:#39734c;stroke-width:2.5;stroke-dasharray:8 5}
    .label{font:700 19px Arial,sans-serif;fill:#172b40;text-anchor:middle}
    .sub{font:14px Arial,sans-serif;fill:#4c5c6d;text-anchor:middle}
    .small{font:13px Arial,sans-serif;fill:#4c5c6d}
    .dim{font:700 17px Arial,sans-serif;fill:#9a7135}
    .window{stroke:#2b86a5;stroke-width:9;stroke-linecap:round}
    .door{fill:none;stroke:#9a7135;stroke-width:3}
    .north{font:700 16px Arial,sans-serif;fill:#172b40}
  </style>
</defs>
<rect width="760" height="900" fill="#fbfaf7"/>
<text x="380" y="34" class="north" text-anchor="middle">NORTH / REAR</text>
<path d="M380 42 L380 62 M370 52 L380 42 L390 52" fill="none" stroke="#172b40" stroke-width="2.5"/>
<text x="380" y="76" class="dim" text-anchor="middle">30 ft overall width</text>
<text x="24" y="440" class="dim" transform="rotate(-90 24 440)" text-anchor="middle">40 ft overall depth</text>
<rect x="90" y="92" width="580" height="680" class="outer"/>
<!-- rear zone -->
<rect x="92" y="94" width="235" height="205" class="sleep"/>
<text x="209" y="178" class="label">PRIMARY BEDROOM</text>
<text x="209" y="205" class="sub">11 × 12 ft target</text>
<text x="209" y="228" class="sub">Bed + wardrobe</text>
<rect x="327" y="94" width="100" height="118" class="service"/>
<text x="377" y="148" class="label" font-size="15">ENSUITE</text>
<text x="377" y="172" class="sub">5 × 7 ft</text>
<rect x="427" y="94" width="115" height="118" class="service"/>
<text x="484" y="148" class="label" font-size="15">SHARED</text>
<text x="484" y="171" class="sub">BATH 5 × 8 ft</text>
<rect x="542" y="94" width="126" height="118" class="service"/>
<text x="605" y="148" class="label" font-size="15">UTILITY</text>
<text x="605" y="171" class="sub">5 × 6 ft target</text>
<rect x="327" y="212" width="341" height="87" class="room"/>
<text x="497" y="252" class="label">REAR PASSAGE / STORAGE</text>
<text x="497" y="276" class="sub">Keep access clear to service rooms</text>
<!-- middle zone -->
<rect x="92" y="299" width="178" height="188" class="sleep"/>
<text x="181" y="374" class="label">BEDROOM 2</text>
<text x="181" y="400" class="sub">10 × 10 ft target</text>
<text x="181" y="423" class="sub">Bed + wardrobe</text>
<rect x="270" y="319" width="220" height="148" class="court"/>
<text x="380" y="382" class="label">OPEN-TO-SKY</text>
<text x="380" y="407" class="label">COURTYARD</text>
<text x="380" y="433" class="sub">6 × 8 ft target</text>
<rect x="490" y="299" width="178" height="188" class="sleep"/>
<text x="579" y="374" class="label">BEDROOM 3</text>
<text x="579" y="400" class="sub">10 × 10 ft target</text>
<text x="579" y="423" class="sub">Flex / guest room</text>
<rect x="92" y="487" width="576" height="64" class="room"/>
<text x="380" y="525" class="label">CENTRAL PASSAGE — TARGET CLEAR WIDTH 3–4 ft</text>
<!-- front zone -->
<rect x="92" y="551" width="350" height="219" class="room"/>
<text x="267" y="644" class="label">LIVING + DINING</text>
<text x="267" y="672" class="sub">14 × 15 ft target</text>
<text x="267" y="696" class="sub">Main entrance from front porch</text>
<rect x="442" y="551" width="226" height="219" class="service"/>
<text x="555" y="644" class="label">KITCHEN</text>
<text x="555" y="672" class="sub">9 × 10 ft target</text>
<text x="555" y="696" class="sub">Counter + sink + cooktop</text>
<!-- porch outside the 30 x 40 envelope -->
<rect x="92" y="772" width="190" height="65" fill="#eee4d3" stroke="#9a7135" stroke-width="2.5"/>
<text x="187" y="800" class="label">COVERED PORCH</text>
<text x="187" y="822" class="sub">6 × 10 ft target</text>
<!-- indicative doors -->
<path d="M92 690 A42 42 0 0 1 134 732" class="door"/>
<path d="M442 590 A36 36 0 0 0 478 554" class="door"/>
<path d="M270 487 A32 32 0 0 1 302 455" class="door"/>
<path d="M490 487 A32 32 0 0 0 458 455" class="door"/>
<!-- indicative windows -->
<path d="M145 94 L220 94" class="window"/>
<path d="M92 350 L92 414" class="window"/>
<path d="M668 350 L668 414" class="window"/>
<path d="M180 770 L250 770" class="window"/>
<path d="M600 770 L650 770" class="window"/>
<text x="92" y="864" class="small">Blue marks: indicative external windows. Gold arcs: indicative door swings.</text>
<text x="92" y="884" class="small">Concept diagram only — not to scale and not a construction drawing.</text>
</svg>